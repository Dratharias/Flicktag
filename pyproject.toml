[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flicktag*"]

[project]
name = "flicktag"
version = "0.1.0"
description = "Fast fullscreen photo and drawing-reference tagger with local AI suggestions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyQt6>=6.7,<6.10",
    "numpy>=1.26,<3",
    "pyexiv2>=2.15,<3",
    "pillow>=10,<12",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
flicktag = "flicktag.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["service: needs the running suggestion container (deselected by default)"]
addopts = "-m 'not service'"
